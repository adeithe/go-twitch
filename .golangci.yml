version: "2"
linters:
  default: standard
  enable:
    - govet
    - gocyclo
    - ineffassign
    - misspell
  settings:
    staticcheck:
      checks:
        - all
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
        - pattern: map[string]struct{}
          replacement: map[string]any
