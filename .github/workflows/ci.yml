name: CI
on: [push, pull_request]

permissions:
  contents: read

env:
  GO_LINT_VERSION: '2.5.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GO_LINT_VERSION }}
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: go test -coverprofile=coverage.out -covermode=atomic -timeout 300s -v ./...
      - name: Hash artifacts (sha256)
        run: |
          sha256sum coverage.out || shasum -a 256 coverage.out
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: test-coverage
          path: coverage.out
          retention-days: 1
  benchmark:
    name: Benchmark
    needs: [lint, test]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install dependencies
        run: go mod download
      - name: Run benchmarks
        run: go test -run=^$ -benchmem -bench ^Benchmark -timeout 300s ./...

  codecov:
    name: Codecov
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Retrieve coverage report
        uses: actions/download-artifact@v7
        with:
          name: test-coverage
      - name: Hash artifacts (sha256)
        run: |
          sha256sum coverage.out || shasum -a 256 coverage.out
      - name: Upload coverage report to Codecov (OIDC)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          verbose: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
      - name: Upload coverage report to Codecov (Tokenless)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: codecov/codecov-action@v5
        with:
          verbose: true
          fail_ci_if_error: true
          files: coverage.out
